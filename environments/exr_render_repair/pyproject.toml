[project]
name = "exr-render-repair"
description = "Repair a render handoff that opens cleanly and is wrong."
version = "0.1.0"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["singleturn", "eval", "vfx", "creative-software"]
tags = ["exr", "vfx", "creative-software", "silent-wrongness"]
dependencies = [
  "datasets",
  "verifiers>=0.2.0",
  "numpy",
  "openexr",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["exr_render_repair.py", "tasks/", "tests/", "instruction.md", "task.toml"]
