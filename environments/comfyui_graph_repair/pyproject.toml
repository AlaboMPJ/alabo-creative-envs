[project]
name = "comfyui-graph-repair"
description = "Repair a ComfyUI API-format workflow until it validates and executes."
version = "0.1.1"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["single-agent", "eval", "vfx", "creative-software"]
tags = ["comfyui", "vfx", "creative-software", "silent-wrongness"]
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "datasets",
  "verifiers>=0.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["comfyui_graph_repair.py"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "comfyui_graph_repair_tasks"
"tests" = "comfyui_graph_repair_tests"
"instruction.md" = "comfyui_graph_repair_instruction.md"
