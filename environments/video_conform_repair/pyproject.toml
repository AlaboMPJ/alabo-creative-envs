[project]
name = "video-conform-repair"
description = "Repair a conform that plays cleanly and is wrong."
version = "0.1.1"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["single-agent", "eval", "vfx", "creative-software"]
tags = ["video", "vfx", "creative-software", "silent-wrongness"]
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "datasets",
  "verifiers>=0.4.1",
  "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["video_conform_repair.py"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "video_conform_repair_tasks"
"tests" = "video_conform_repair_tests"
"instruction.md" = "video_conform_repair_instruction.md"
